[project]
name = "relay"
version = "0.1.0"
description = "Relay: migration operations for ERP implementations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.141,<0.142",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.53,<0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "hypothesis>=6.168",
    "import-linter>=2.15",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16.8",
]

[project.scripts]
relay = "relay.cli:main"
relay-demo = "relay_scenarios.cli:main"
relay-eval = "relay_evaluation.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay", "src/relay_scenarios", "src/relay_evaluation"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "DTZ", "T20",
    "SIM", "PT", "RET", "ARG", "PL", "RUF", "TRY", "PERF", "LOG", "G",
]
ignore = [
    "TRY003",   # long messages in exception constructors are fine with RelayError codes
    "PLR2004",  # magic values are clearer inline in tests and bounds checks
    "PLR0913",
    "ARG002",   # overridden framework methods (e.g. TypeDecorator) must keep their signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["INP001"]
# FastAPI endpoints declare dependencies and parameters as positional function arguments.
"src/relay/api/routers/**" = ["PLR0917"]
# Autogenerated CHECK constraint literals are long single strings.
"migrations/versions/**" = ["E501"]
# Hand-authored reference data tables: one record per line reads better than wrapped tuples.
"src/relay_scenarios/brightwater/chart.py" = ["E501", "PLR0917", "RUF001"]
# Scenario generation and evaluation orchestration: long, linear build steps are clearer than splitting.
"src/relay_scenarios/**" = ["PLR0911", "PLR0912", "PLR0915", "PLR0917"]
"src/relay_evaluation/**" = ["PLR0911", "PLR0912", "PLR0915", "PLR0917"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]
exclude = []

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # Third-party: starlette.testclient (1.6.0) references a deprecated anyio alias at import time.
    # Not our code; remove when Starlette updates. Every other warning fails the test run.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
    "integration: requires a PostgreSQL database (RELAY_TEST_DATABASE_URL)",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["relay", "relay_scenarios", "relay_evaluation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Runtime layers: api > worker > investigations > ai > pipeline > changes > issues > mapping sets > imports > workspace > audit > engine > readers > canonical > core"
type = "layers"
layers = [
    "relay.api",
    "relay.worker",
    "relay.investigations",
    "relay.ai",
    "relay.pipeline",
    "relay.changes",
    "relay.issues",
    "relay.mapping_sets",
    "relay.imports",
    "relay.workspace | relay.identity | relay.jobs",
    "relay.audit",
    "relay.engine",
    "relay.ingestion | relay.mapping | relay.profiling",
    "relay.canonical",
    "relay.core",
]
containers = []

[[tool.importlinter.contracts]]
name = "AI reads only: no services, write paths, session factories, jobs or API (direct imports)"
type = "forbidden"
source_modules = ["relay.ai"]
forbidden_modules = [
    "relay.api",
    "relay.worker",
    "relay.investigations",
    "relay.audit.service",
    "relay.changes.service",
    "relay.changes.kinds",
    "relay.identity.service",
    "relay.imports.service",
    "relay.imports.blob_store",
    "relay.issues.service",
    "relay.issues.workflow",
    "relay.jobs",
    "relay.mapping_sets.service",
    "relay.mapping_sets.accounts",
    "relay.pipeline.service",
    "relay.pipeline.approvals",
    "relay.pipeline.overrides",
    "relay.pipeline.readiness",
    "relay.pipeline.inputs",
    "relay.workspace.service",
    "relay.core.db",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Read models never import write paths (so AI tools reach none indirectly)"
type = "forbidden"
source_modules = [
    "relay.audit.read_model",
    "relay.changes.read_model",
    "relay.imports.read_model",
    "relay.issues.read_model",
    "relay.mapping_sets.read_model",
    "relay.pipeline.read_model",
    "relay.workspace.read_model",
]
forbidden_modules = [
    "relay.audit.service",
    "relay.changes.service",
    "relay.changes.kinds",
    "relay.identity.service",
    "relay.imports.service",
    "relay.issues.service",
    "relay.issues.workflow",
    "relay.jobs.service",
    "relay.mapping_sets.service",
    "relay.mapping_sets.accounts",
    "relay.pipeline.service",
    "relay.pipeline.approvals",
    "relay.workspace.service",
]

[[tool.importlinter.contracts]]
name = "The engine is pure: no database, web framework, network or clock access"
type = "forbidden"
source_modules = ["relay.engine", "relay.ingestion", "relay.mapping", "relay.canonical"]
forbidden_modules = [
    "relay.api",
    "relay.core.db",
    "relay.core.db_types",
    "relay.core.clock",
    "relay.core.config",
    "sqlalchemy",
    "psycopg",
    "fastapi",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Runtime code never imports scenario generators or evaluation truth"
type = "forbidden"
source_modules = ["relay"]
forbidden_modules = ["relay_scenarios", "relay_evaluation"]

[[tool.importlinter.contracts]]
name = "Scenario generators never read evaluation truth"
type = "forbidden"
source_modules = ["relay_scenarios"]
forbidden_modules = ["relay_evaluation"]
