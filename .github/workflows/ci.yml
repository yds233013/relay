name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: make setup

      - name: Full verification
        env:
          # FC-06: business dates and UTC timestamps must not move with the process timezone.
          # A half-hour offset ahead of UTC would expose a date built from local time.
          TZ: Australia/Adelaide
        run: make check

      - name: Build images and smoke-test the stack
        env:
          RELAY_API_HOST_PORT: "8000"
          RELAY_WEB_HOST_PORT: "3000"
        run: |
          make up
          make smoke

      - name: Seed Brightwater and run end-to-end tests
        env:
          RELAY_API_HOST_PORT: "8000"
          RELAY_WEB_HOST_PORT: "3000"
        run: |
          make demo-seed
          make test-e2e

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
