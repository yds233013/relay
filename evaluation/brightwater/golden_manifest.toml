# Brightwater Provisions — golden manifest (EVALUATION GROUND TRUTH)
#
# Hand-authored from docs/demo-scenario.md and docs/decisions/0002-brightwater-spec-corrections.md
# (SC-01 – SC-08). It is NOT generated from generator output. Tests compare the generated scenario
# against it; later milestones compare Relay's engine output against it.
#
# Runtime code must never read this file (enforced by tests and import-linter).
#
# Conventions
# - Amounts are decimal strings in functional currency (USD), signed where a difference is stated:
#   difference = left - right, debit positive / credit negative (validation-and-reconciliation.md).
# - Dates are ISO. CSV cell values are compared after normalization: amounts parsed with the LedgerPro
#   format (thousands separators), MM/DD/YYYY dates converted to ISO.
# - Facts describe the complete Run #1 scenario. A fact that also depends on other seeded issues lists
#   them in `requires`; isolation tests skip such facts when those issues are not applied.
# - Where the specification does not fix an identifier (for example a generated vendor code), records
#   are identified by documented attributes instead.

schema_version = 1
scenario = "brightwater-provisions"
seed = 20260630

[conversion_plan]
opening_balance_date = "2025-12-31"
history_start_date = "2026-01-01"
cutover_date = "2026-06-30"
go_live_date = "2026-07-01"
bank_export_end = "2026-07-15"

# Control totals of the defective (Run #1) scenario.
[controls]
gl_cash_1010_at_cutover = "412906.18"
bank_balance_at_cutover = "427101.93"
legacy_1205_balance_at_cutover = "-38400.00"

# Control totals of the clean books, derived from the fixed facts minus documented injector effects.
[clean_controls]
gl_cash_1010_at_cutover = "427768.68"   # 412,906.18 + 14,862.50 (DS-02 duplicate disbursement)
bank_balance_at_cutover = "442234.43"   # 427,101.93 + 14,862.50 (DS-02) + 270.00 (DS-10 fees)

# Run #1 readiness (docs/demo-scenario.md §6.1).
[run1_gates]
failing = ["G1", "G3", "G5", "G6", "G7", "G8", "G9", "G10", "G12"]
passing = ["G2", "G4", "G11"]

