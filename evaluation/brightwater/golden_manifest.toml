# Defects
# =====================================================================================================

[[defects]]
id = "DS-01"
title = "Duplicate vendor"
category = "master_data"
nature = "migration_defect"
depends_on = []
visible_in_run1 = true
condition = "Always present in Run #1."

  [[defects.facts]]
  check = "csv_rows"
  file = "ledgerpro/ledgerpro_vendors.csv"
  where = { "Vendor ID" = "V-1187" }
  count = 1
  expect = { "Vendor Name" = "Pacific Coast Packaging, L.L.C.", "Address" = "4410 N.W. Front Avenue, Suite 200", "City" = "Portland", "State" = "OR", "Zip" = "97209", "Tax ID" = "XX-XXX7781", "Created" = "2026-02-11" }

  [[defects.facts]]
  check = "csv_rows"
  file = "ledgerpro/ledgerpro_vendors.csv"
  where = { "Vendor ID" = "V-1042" }
  count = 1
  expect = { "Vendor Name" = "Pacific Coast Packaging LLC", "Address" = "4410 NW Front Ave Ste 200", "Tax ID" = "XX-XXX7781" }

  [[defects.facts]]
  check = "csv_rows"
  file = "ledgerpro/ledgerpro_bills.csv"
  where = { "Vendor ID" = "V-1042" }
  count = 23

  [[defects.facts]]
  check = "csv_rows"
  requires = ["DS-02"]   # three re-keyed bills plus DS-02's duplicate bill
  file = "ledgerpro/ledgerpro_bills.csv"
  where = { "Vendor ID" = "V-1187" }
  count = 4

  [[defects.facts]]
